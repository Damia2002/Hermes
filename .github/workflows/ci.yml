name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run security tests
        run: uv run pytest tests/security/ -v --tb=short

      - name: Run reliability tests
        run: uv run pytest tests/reliability/ -v --tb=short

      - name: Run integration tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./storage/test.db"
          GROQ_API_KEY: "test-key-not-real"
          LANGFUSE_ENABLED: "false"
        run: uv run pytest tests/integration/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check app/ tests/ evals/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/ evals/ scripts/
