[project]
name = "hermes-enterprise-agent"
version = "0.1.0"
description = "Hybrid Enterprise Retrieval, Monitoring and Execution System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Damiano Giallongo" }]

dependencies = [
    # Agent orchestration
    "crewai[google-genai]>=0.80.0",
    "crewai-tools>=0.14.0",
    # Retrieval framework
    "llama-index>=0.11.0",
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    # LLM provider
    "groq>=0.11.0",
    "litellm>=1.50.0",
    # Embeddings and reranking
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",
    # Vector database
    "qdrant-client>=1.11.0",
    # Sparse retrieval
    "rank-bm25>=0.2.2",
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP client with reliability
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # Database
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # UI
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    # Observability
    "langfuse>=2.20.0",
    "structlog>=24.4.0",
    # Dataset
    "datasets>=3.1.0",
    "huggingface-hub>=0.26.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "tqdm>=4.67.0",
    "numpy>=1.26.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
eval = [
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
hermes = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]
